name: Pre-production Docker

on:
  push:
    branches: [pre]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pip2api-pre-production
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: btcfoxman
  IMAGE_NAME: pip2api
  DEPLOY_PATH: /home/btcfoxman/docker/pip2api
  DEPLOY_SERVICE: pip2api
  PIP2API_HOSTNAME: pip2api.aiid.edu.kg
  PIP2API_ORIGIN: http://127.0.0.1:8807

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application on GitHub-hosted runner
        env:
          PIP_API_KEY: ci-only-api-key
          PIP_ADMIN_TOKEN: ci-only-admin-token
          PIP_DATA_DIR: /tmp/pip2api-ci
        run: |
          python -m pip install -r requirements.txt 'pytest>=8,<9'
          python -m pytest -q
          python -m compileall -q app scripts
          node --check app/static/app.js
          node --check app/task_cost.js
      - name: Generate verified source manifest
        run: python scripts/build_manifest.py --revision "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/btcfoxman/pip2api:${{ github.sha }}
            ghcr.io/btcfoxman/pip2api:latest
          platforms: linux/amd64
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, pip2api-pre]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Isolate registry credentials
        run: |
          mkdir -p "$RUNNER_TEMP/pip2api-docker-auth"
          chmod 700 "$RUNNER_TEMP/pip2api-docker-auth"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/pip2api-docker-auth" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull immutable release and restart only while idle
        env:
          RELEASE_IMAGE: ghcr.io/btcfoxman/pip2api@${{ needs.build.outputs.image_digest }}
          RELEASE_REVISION: ${{ github.sha }}
        run: python3 scripts/deploy_release.py --idle-timeout 1200
      - name: Verify public endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${PIP2API_HOSTNAME}/health" >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
